{# One category row of a book form (see _category_rows.html). Takes id_prefix, index (a number, or
   "__index__" in the <template> that app.js copies), value, errors and first: the first row has the
   + button, the others a - button. Both submit the form when JavaScript is off, so the server adds
   or removes the row. Typing fills the row's <datalist> with matching categories from the server
   (app.js sends the text as q). #}
{% set id = id_prefix ~ "categories-" ~ index %}
<div class="category-row" data-row data-index="{{ index }}">
  <input id="{{ id }}" name="categories-{{ index }}" value="{{ value or '' }}"
         maxlength="64" autocomplete="off" placeholder="Category" aria-label="Category"
         list="{{ id }}-suggestions" data-suggest
         hx-get="{{ url_for('main.category_suggestions') }}"
         hx-trigger="input changed delay:200ms" hx-target="#{{ id }}-suggestions" hx-swap="innerHTML"
         hx-sync="this:replace" hx-indicator="closest .category-row">
  <datalist id="{{ id }}-suggestions"></datalist>
  {% if first %}
    <button type="submit" class="row-button" name="add_category" value="1" formnovalidate
            data-row-add aria-label="Add another category" title="Add another category">+</button>
  {% else %}
    <button type="submit" class="row-button secondary" name="remove_category" value="{{ index }}"
            formnovalidate data-row-remove aria-label="Remove this category" title="Remove this category">−</button>
  {% endif %}
  {% for error in errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
