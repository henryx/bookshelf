{# Hidden fields with the book list a form was opened from (list_name, author_id, search,
   sort, page), so the server can send the user back to it as it was. #}
<input type="hidden" name="list" value="{{ list_name }}">
{% if author_id %}<input type="hidden" name="author" value="{{ author_id }}">{% endif %}
<input type="hidden" name="q" value="{{ search }}">
<input type="hidden" name="sort" value="{{ sort }}">
<input type="hidden" name="page" value="{{ page }}">
