{# A book's title (and ISBN, when not editable), shown, and its edit form: the book dialog's content, and the body of the book page. #}
<dl class="book-details">
  <dt>Title</dt>
  <dd class="book-details-title">{{ book.title }}</dd>
  {% if book.isbn and not form.isbn %}<dt>ISBN</dt><dd class="mono">{{ book.isbn }}</dd>{% endif %}
</dl>
{% include "_edit_book_form.html" %}
