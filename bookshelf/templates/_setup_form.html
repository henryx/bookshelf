<form id="setup-form" class="card" method="post" action="{{ url_for('setup.wizard') }}"
      hx-post="{{ url_for('setup.wizard') }}" hx-target="this" hx-swap="outerHTML"
      hx-indicator="#setup-indicator" hx-disabled-elt="find button">
  {{ form.hidden_tag() }}
  {% for error in form.form_errors %}
    <p class="error" role="alert">{{ error }}</p>
  {% endfor %}

  <label for="email">Admin email</label>
  {{ form.email(id="email", autocomplete="username", required=True, autofocus=True) }}
  {% for error in form.email.errors %}<p class="error">{{ error }}</p>{% endfor %}

  {% include "_new_password_fields.html" %}

  <button type="submit">Create admin</button>
  <span id="setup-indicator" class="htmx-indicator">Setting up…</span>
</form>
