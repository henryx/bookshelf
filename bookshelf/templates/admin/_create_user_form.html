<form id="create-user-form" class="card" method="post" action="{{ url_for('admin.users') }}"
      hx-post="{{ url_for('admin.users') }}" hx-target="this" hx-swap="outerHTML"
      hx-indicator="#create-user-indicator" hx-disabled-elt="find button">
  {{ form.hidden_tag() }}
  {% for error in form.form_errors %}
    <p class="error" role="alert">{{ error }}</p>
  {% endfor %}

  <label for="email">{{ form.email.label.text }}</label>
  {{ form.email(id="email", autocomplete="off", required=True) }}
  {% for error in form.email.errors %}<p class="error">{{ error }}</p>{% endfor %}

  {% include "_new_password_fields.html" %}

  <button type="submit">Create user</button>
  <span id="create-user-indicator" class="htmx-indicator">Creating…</span>
</form>
