{# A user's edit form and delete button: the edit dialog's content, and the body of the details page. #}
{% include "admin/_user_form.html" %}

{% if not is_self %}
  <form class="danger" method="post"
        action="{{ url_for('admin.delete', user_id=user.id) }}"
        hx-post="{{ url_for('admin.delete', user_id=user.id) }}"
        hx-confirm="Delete user {{ user.email }}? This cannot be undone."
        hx-indicator="#delete-indicator" hx-disabled-elt="find button">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Delete user</button>
    <span id="delete-indicator" class="htmx-indicator">Deleting…</span>
  </form>
{% endif %}
