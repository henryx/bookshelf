name: Docker image

# Called by the Tests workflow (tests.yml) once all its checks have passed, so
# no image is published from a commit that fails them. It runs in the caller's
# context: github.event_name and github.ref are those of the push, tag or pull
# request that started Tests, and Tests' concurrency group cancels it too.
on:
  workflow_call:
    secrets:
      # quay.io credentials (a robot account works), needed only to push:
      # pull requests just build, and forks' pull requests do not get them.
      QUAY_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Push for commits on main and version tags; PRs and other refs just build.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error file=pyproject.toml::Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version"
            exit 1
          fi
          echo "Version $project_version matches tag $GITHUB_REF_NAME"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: quay.io/enricobianchi/bookshelf
          # latest follows main only, not version tags
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to quay.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max also caches the intermediate venv and wheel stages
          cache-from: type=gha
          cache-to: type=gha,mode=max
