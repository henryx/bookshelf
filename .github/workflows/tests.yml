name: Tests

on:
  push:
    branches: [main]
    # Version tags too: their image (docker.yml) is published only once these pass.
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [lint, type, audit, py3]
        include:
          # check only: fail on unformatted files instead of rewriting them
          - env: format
            args: -- --check .
          # browser tests: Chromium also needs its system libraries on the runner
          - env: e2e
            playwright_install_args: --with-deps chromium
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # py3 starts Firebird via testcontainers (Docker is preinstalled on
      # ubuntu-latest).
      - name: Run tox -e ${{ matrix.env }}
        run: uv run tox -e ${{ matrix.env }} ${{ matrix.args }}
        env:
          PLAYWRIGHT_INSTALL_ARGS: ${{ matrix.playwright_install_args || 'chromium' }}

  # The Docker image, built only once every check above has passed; pushed to
  # quay.io/enricobianchi/bookshelf for main and version tags (pull requests
  # just build it).
  image:
    name: image
    needs: tox
    permissions:
      contents: read
    uses: ./.github/workflows/docker.yml
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # The Helm chart, linted on every run; pushed to
  # oci://quay.io/enricobianchi/bookshelf-chart for version tags, once their
  # image is published.
  chart:
    name: chart
    needs: image
    permissions:
      contents: read
    uses: ./.github/workflows/helm.yml
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
