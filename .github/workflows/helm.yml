name: Helm chart

# Called by the Tests workflow (tests.yml) after the image job, in the
# caller's context (see docker.yml). Lints and renders the chart on every
# run; pushes it to oci://quay.io/enricobianchi/bookshelf-chart for version
# tags only, after their image is published.
on:
  workflow_call:
    secrets:
      # quay.io credentials, needed only to push (version tags); the account
      # needs write access to quay.io/enricobianchi/bookshelf-chart.
      QUAY_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHART: deploy/helm/bookshelf-chart
      PUBLISH: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Both database modes, with throwaway values for the required settings.
      - name: Lint and render
        run: |
          in_cluster="secretKey=k,database.password=p,firebird.enabled=true,firebird.rootPassword=r,ingress.enabled=true"
          external="secretKey=k,database.password=p,database.dsn=db.example.com:/data/bookshelf.fdb"
          helm lint --strict "$CHART" --set "$in_cluster"
          helm lint --strict "$CHART" --set "$external"
          helm template bookshelf "$CHART" --set "$in_cluster" > /dev/null
          helm template bookshelf "$CHART" --set "$external" > /dev/null

      - name: Check tag matches chart versions
        if: env.PUBLISH == 'true'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version="$(helm show chart "$CHART" | sed -n 's/^version: //p')"
          app_version="$(helm show chart "$CHART" | sed -n 's/^appVersion: //p' | tr -d '"')"
          if [ "$chart_version" != "$tag_version" ] || [ "$app_version" != "$tag_version" ]; then
            echo "::error file=$CHART/Chart.yaml::Tag $GITHUB_REF_NAME does not match chart version $chart_version / appVersion $app_version"
            exit 1
          fi
          echo "Chart $chart_version matches tag $GITHUB_REF_NAME"

      - name: Package and push
        if: env.PUBLISH == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
          helm package "$CHART" --destination dist-chart
          helm push dist-chart/*.tgz oci://quay.io/enricobianchi
