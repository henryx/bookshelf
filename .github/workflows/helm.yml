name: Helm chart

# Called by the Tests workflow (tests.yml) after the image job, in the
# caller's context (see docker.yml). Lints and renders the chart on every
# run; pushes it to oci://quay.io/enricobianchi/bookshelf-chart for version
# tags only, after their image is published.
on:
  workflow_call:
    secrets:
      # quay.io credentials, needed only to push (version tags); the account
      # needs write access to quay.io/enricobianchi/bookshelf-chart.
      QUAY_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHART: deploy/helm/bookshelf-chart
      PUBLISH: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Each database (Firebird, PostgreSQL) in the cluster and external, with
      # throwaway values for the required settings.
      - name: Lint and render
        run: |
          for values in \
            "secretKey=k,database.password=p,firebird.enabled=true,firebird.rootPassword=r,ingress.enabled=true" \
            "secretKey=k,database.password=p,database.dsn=db.example.com:/data/bookshelf.fdb" \
            "secretKey=k,database.password=p,postgresql.enabled=true,ingress.enabled=true" \
            "secretKey=k,database.password=p,database.backend=postgresql,database.dsn=pg.example.com/bookshelf"
          do
            helm lint --strict "$CHART" --set "$values"
            helm template bookshelf "$CHART" --set "$values" > /dev/null
          done

      - name: Package and push
        if: env.PUBLISH == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
          helm package "$CHART" --destination dist-chart
          helm push dist-chart/*.tgz oci://quay.io/enricobianchi
