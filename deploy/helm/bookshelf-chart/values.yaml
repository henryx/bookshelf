image:
  repository: quay.io/enricobianchi/bookshelf
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# Non-secret settings, as environment variables (see README.md,
# "Configuration"). APP_DB_BACKEND, APP_DB_DSN and APP_SEARCH_LANGUAGE are
# set from `database` below.
config:
  APP_LOG_LEVEL: info
  # Behind the ingress controller: client IP and HTTPS come from
  # X-Forwarded-*. Set "0" if the Service is exposed directly.
  APP_TRUSTED_PROXIES: "1"
  # The container sees the node's CPUs, not its limit: set workers explicitly.
  APP_WORKERS: "2"

# The app's secrets. Either name an existing Secret with the keys
# APP_SECRET_KEY, APP_DB_USER, APP_DB_PASSWORD (and FIREBIRD_ROOT_PASSWORD
# with firebird.enabled), or set the values below and the chart creates it.
existingSecret: ""
# Signs session and login cookies, e.g.:
# python3 -c 'import secrets; print(secrets.token_urlsafe(48))'
secretKey: ""

# Google Books API key, for the add form's Look up (README.md,
# "Configuration"); optional: without one, Google Books allows fewer lookups
# a day. Set it here and the chart puts it in its Secret, or add the key
# APP_GOOGLE_BOOKS_API_KEY to existingSecret.
googleBooksApiKey: ""

# Logging in with Google (README.md, "Logging in with Google"): a Google OAuth
# client for a web application, whose authorised redirect URI is
# https://<host>/login/google/callback. The client has a Secret of its own,
# apart from the app's (existingSecret): either name an existing one with the
# keys APP_GOOGLE_CLIENT_ID and APP_GOOGLE_CLIENT_SECRET, or set clientId and
# clientSecret and the chart creates <release>-google. Neither: no Google login.
google:
  clientId: ""
  clientSecret: ""
  existingSecret: ""

database:
  # The database server: firebird or postgresql (18 or newer). Set by
  # firebird.enabled or postgresql.enabled when one of them is.
  backend: firebird
  # The database user: allowed to create the tables (e.g. the database
  # owner). With firebird.enabled or postgresql.enabled, the server creates
  # it on its first start.
  user: bookshelf
  password: ""
  # An existing server and database; ignored with firebird.enabled or
  # postgresql.enabled. Firebird: firebird.example.com:/var/lib/firebird/data/bookshelf.fdb;
  # PostgreSQL: postgres.example.com/bookshelf (host[:port]/database).
  dsn: ""
  # PostgreSQL only: the text search configuration of the book and author
  # searches (stemming, stop words), e.g. italian, or simple for none.
  searchLanguage: english

service:
  type: ClusterIP
  port: 80

# HTTPS is required: session cookies are Secure.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: bookshelf.example.com
  # TLS certificate Secret for the host (e.g. created by cert-manager).
  tlsSecretName: bookshelf-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Runs init-db (creates missing tables, indexes and functions) after
# install and before each upgrade, so a release's schema additions are in
# place before its pods serve.
initDb:
  enabled: true

# Deletes failed logins older than APP_LOGIN_BLOCK_MINUTES.
pruneLoginFailures:
  enabled: true
  schedule: "17 * * * *"

# Firebird 3 in the cluster: one pod with its own volume (Firebird has no
# replication: back the volume up).
firebird:
  enabled: false
  image:
    repository: firebirdsql/firebird
    tag: "3.0.14"
    pullPolicy: IfNotPresent
  # SYSDBA password (the app does not use it).
  rootPassword: ""
  persistence:
    size: 5Gi
    # Empty: the cluster's default storage class.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# PostgreSQL 18 in the cluster: one pod with its own volume (no replication:
# back it up, e.g. pg_dump). The app's user (database.user and password) is
# its owner, created on the first start.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    # Empty: the cluster's default storage class.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
