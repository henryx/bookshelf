{{- if .Values.firebird.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bookshelf.firebird.fullname" . }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    {{- include "bookshelf.firebird.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "bookshelf.firebird.selectorLabels" . | nindent 4 }}
  ports:
    - name: firebird
      port: 3050
      targetPort: firebird
{{- end }}
