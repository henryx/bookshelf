{{- if .Values.initDb.enabled }}
# A hook, so it runs once per release (pods starting together would clash on
# DDL) and an upgrade's schema additions come before its pods. It retries
# while the database is starting; if it keeps failing the upgrade fails and
# the old pods keep serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bookshelf.fullname" . }}-init-db
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "bookshelf.labels" . | nindent 8 }}
    spec:
      {{- include "bookshelf.cliPodSpec" (dict "root" . "command" "init-db") | nindent 6 }}
{{- end }}
