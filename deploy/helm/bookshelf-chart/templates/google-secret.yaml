{{- $clientId := include "bookshelf.googleAuth" (dict "root" . "name" "clientId") }}
{{- if and $clientId (not (include "bookshelf.googleAuth" (dict "root" . "name" "existingSecret"))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookshelf.googleSecretName" . }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    {{- include "bookshelf.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  APP_GOOGLE_CLIENT_ID: {{ $clientId | quote }}
  APP_GOOGLE_CLIENT_SECRET: {{ required "google.auth.clientSecret is required with google.auth.clientId (or google.auth.existingSecret)" (include "bookshelf.googleAuth" (dict "root" . "name" "clientSecret")) | quote }}
{{- end }}
