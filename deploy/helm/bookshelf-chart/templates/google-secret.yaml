{{- if and .Values.google.clientId (not .Values.google.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookshelf.googleSecretName" . }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    {{- include "bookshelf.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  APP_GOOGLE_CLIENT_ID: {{ .Values.google.clientId | quote }}
  APP_GOOGLE_CLIENT_SECRET: {{ required "google.clientSecret is required with google.clientId (or google.existingSecret)" .Values.google.clientSecret | quote }}
{{- end }}
