apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookshelf.fullname" . }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    {{- include "bookshelf.selectorLabels" . | nindent 4 }}
data:
  APP_DB_DSN: {{ include "bookshelf.dbDsn" . | quote }}
  {{- with .Values.google.clientId }}
  APP_GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
