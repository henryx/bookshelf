{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookshelf.fullname" . }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    {{- include "bookshelf.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ required "secretKey is required (or existingSecret)" .Values.secretKey | quote }}
  APP_DB_USER: {{ required "database.user is required" .Values.database.user | quote }}
  APP_DB_PASSWORD: {{ required "database.password is required (or existingSecret)" .Values.database.password | quote }}
  {{- with (.Values.google | default dict).booksApiKey | default .Values.googleBooksApiKey }}
  APP_GOOGLE_BOOKS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- if .Values.firebird.enabled }}
  FIREBIRD_ROOT_PASSWORD: {{ required "firebird.rootPassword is required (or existingSecret)" .Values.firebird.rootPassword | quote }}
  {{- end }}
{{- end }}
