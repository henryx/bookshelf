[tox]
requires =
    tox>=4
    tox-uv>=1
env_list =
    clean
    lint
    type
    py3
    report

[testenv]
description = run unit tests
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    dotenv -f test.env run pytest --cov=bookshelf --cov-append --cov-report=term-missing {posargs:tests}

[testenv:lint]
description = run linter
skip_install = true
commands = ruff check {posargs:.}

[testenv:format]
description = run format
skip_install = true
commands = ruff format {posargs:.}

[testenv:type]
description = run type checks
skip_install = true
commands = ty check {posargs:bookshelf tests}

[testenv:report]
description = report test coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
description = erase previous coverage data
skip_install = true
commands = coverage erase
