[tox]
requires =
    tox>=4
    tox-uv>=1
env_list =
    clean
    lint
    type
    py3
    py3-postgres
    e2e
    e2e-firefox
    audit
    report

[testenv]
description = run unit tests
# Every env, py3 included, on the Python of .python-version and the Docker image.
base_python = python3.14
runner = uv-venv-lock-runner
dependency_groups = dev
# In parallel (pytest-xdist): each worker starts its own Firebird container, so
# tests never share a database. More than 8 workers gains nothing; `-- -n0`
# runs in one process.
commands =
    dotenv -f test.env run pytest -n auto --maxprocesses=8 --cov=bookshelf --cov-append --cov-report=term-missing --ignore=tests/e2e {posargs:tests}

[testenv:py3-postgres]
description = run unit tests on PostgreSQL
# The same tests as py3, each worker on a PostgreSQL container of its own.
set_env =
    TEST_DB_BACKEND = postgresql

[testenv:e2e]
description = run browser tests of the JavaScript (Playwright, Chromium)
commands_pre =
    playwright install {env:PLAYWRIGHT_INSTALL_ARGS:chromium}
commands =
    dotenv -f test.env run pytest {posargs:tests/e2e}

[testenv:e2e-firefox]
description = run browser tests of the JavaScript in Firefox (Playwright)
commands_pre =
    playwright install {env:PLAYWRIGHT_INSTALL_ARGS:firefox}
commands =
    dotenv -f test.env run pytest --browser firefox {posargs:tests/e2e}

[testenv:lint]
description = run linter
skip_install = true
commands = ruff check {posargs:.}

[testenv:format]
description = run format
skip_install = true
commands = ruff format {posargs:.}

[testenv:type]
description = run type checks
skip_install = true
commands = ty check {posargs:bookshelf tests}

[testenv:audit]
description = check dependencies for known vulnerabilities
skip_install = true
commands = pip-audit {posargs}

[testenv:report]
description = report test coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
description = erase previous coverage data
skip_install = true
commands = coverage erase
