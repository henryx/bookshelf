[project]
name = "bookshelf"
version = "0.0.0"
description = "Bookshelf library app"
authors = [
    { name = "Enrico Bianchi", email = "enrico.bianchi@gmail.com" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3,<4",
    "flask-cors>=6.0.0,<7",
    "flask-httpauth>=4.7.0,<5",
    "gunicorn>=26.0.0,<27",
    "json-logging>=1.3.0,<2",
]

[dependency-groups]
dev = [
    "tox>=4.4.7,<5",
    "ruff>=0.16.0,<0.17.0",
    "ty>=0.0.95",
    "python-dotenv[cli]>=1.0.0,<2",
    "pytest>=9.0.3,<10",
    "pytest-sugar>=1.1.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pip-audit>=2.10.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bookshelf"
module-root = ""
