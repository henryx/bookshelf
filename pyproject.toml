[project]
name = "bookshelf"
version = "1.3.0"
description = "Bookshelf library app"
authors = [
    { name = "Enrico Bianchi", email = "enrico.bianchi@gmail.com" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0,<26",
    "authlib>=1.6,<2",
    "click>=8.5.0,<9",
    "email-validator>=2,<3",
    "firebird-driver>=2.1.2,<3",
    "flask>=3.1.3,<4",
    "flask-login>=0.6.3,<0.7",
    "flask-wtf>=1.3.0,<2",
    "gunicorn>=26.0.0,<27",
    "prettytable>=3.18.0,<4",
    "python-json-logger>=4.2.0,<5",
    "requests>=2.32,<3",
    "wtforms>=3.3.1,<4",
]

[dependency-groups]
dev = [
    "tox>=4.4.7,<5",
    "ruff>=0.16.0,<0.17.0",
    "ty>=0.0.95",
    "python-dotenv[cli]>=1.0.0,<2",
    "pytest>=9.0.3,<10",
    "pytest-sugar>=1.1.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pip-audit>=2.10.0,<3",
    "testcontainers>=4.15.0,<5",
    "tox-uv>=1.37.3,<2",
    "pytest-playwright>=0.10.0,<0.11",
    "pytest-xdist>=3.8,<4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bookshelf"
module-root = ""

[tool.pytest.ini_options]
filterwarnings = [
    # flask-login 0.6.3 (the latest) calls datetime.utcnow(), deprecated since Python 3.12
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login",
]
