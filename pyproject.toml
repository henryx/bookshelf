[project]
name = "bookshelf"
version = "0.0.0"
description = "Bookshelf library app"
authors = [
    { name = "Enrico Bianchi", email = "enrico.bianchi@gmail.com" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "flask>=2.2.3,<3",
    "flask-cors>=3.0.10,<4",
    "flask-httpauth>=4.7.0,<5",
    "gunicorn>=20.1.0,<21",
    "json-logging>=1.3.0,<2",
]

[dependency-groups]
dev = [
    "tox>=4.4.7,<5",
    "ruff>=0.16.0,<0.17.0",
    "ty>=0.0.95",
    "python-dotenv[cli]>=1.0.0,<2",
    "pytest>=7.2.2,<8",
    "pytest-sugar>=0.9.7,<0.10",
    "pytest-cov>=4.0.0,<5",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "restapi"
module-root = ""
